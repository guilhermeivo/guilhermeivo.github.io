<!DOCTYPE html>
<html lang="{{ site.lang | default: "pt-br" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">

    <title>{{ site.title }} | {{ page.title }}</title>
    <meta name="description" content="Some programming-related projects, developed">
    <meta name="theme-color" content="#0476ce">

    <meta name="twitter:site" content="@portfolio">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Portfolio">
    <meta name="twitter:description" content="🕹️">
    <meta property="og:image" content="./cover.png">
    <meta property="og:image:alt" content="cover">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="600">
    <meta property="og:site_name" content="Portfolio">
    <meta property="og:type" content="object">
    <meta property="og:title" content="Portfolio">
    <meta property="og:url" content="https://guilhermeivo.github.io/">
    <meta property="og:description" content="Some programming-related projects, developed">

    <link rel="preload" href="{{ "/assets/font/lmroman10-bold.otf" | relative_url }}" as="font" type="font/otf" crossorigin="anonymous">

    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
</head>
<body>
    {% include header.html %}

    <article>
        <aside>
            <div>
                <h1 class="title">{{ page.title }}</h1>
                <h4>{{ page.subtitle }}</h4>

                <p>{{ page.date | date_to_string }}</p>
            </div>
        </aside>
        <main>
            {{ content }}
        </main>
    </article>

    {% include footer.html %}
</body>
</html>
